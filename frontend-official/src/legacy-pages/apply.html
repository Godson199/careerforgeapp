<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Apply to CareerForge training and internship programmes.">
    <title>Apply | CareerForge Analytics</title>
    <link rel="shortcut icon" href="/images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/default.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <link rel="stylesheet" href="/src/careerforge.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="cf-apply-page">
    <header class="cf-apply-header">
        <a href="index.html" aria-label="CareerForge home">
            <img src="/images/careerforge-logo.png" alt="CareerForge">
        </a>
        <a href="index.html" class="main-btn">Back to home</a>
    </header>

    <main class="cf-apply-main">
        <section class="cf-apply-card" aria-labelledby="apply-title">
            <h1 id="apply-title">Apply to CareerForge</h1>
            <p class="cf-apply-intro">Tell us a little about yourself to get started.</p>

            <form id="cf-application-form" novalidate>
                <input id="applicationType" name="applicationType" type="hidden" value="Training">
                <div class="btn-group w-100 mb-4" role="group" aria-label="Application type">
                    <button class="btn btn-primary" type="button" data-application-type="Training" aria-pressed="true">Training Applicant</button>
                    <button class="btn btn-outline-dark" type="button" data-application-type="Internship" aria-pressed="false">Internship Applicant</button>
                </div>
                <div class="form-group">
                    <label for="fullName">Full name</label>
                    <input class="form-control" id="fullName" name="name" type="text" placeholder="Jane Doe" autocomplete="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input class="form-control" id="email" name="email" type="email" autocomplete="email" required>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="country">Country</label>
                        <select class="form-control" id="country" name="country" required>
                            <option value="Nigeria">Nigeria</option>
                            <option value="Ghana">Ghana</option>
                            <option value="Kenya">Kenya</option>
                            <option value="South Africa">South Africa</option>
                            <option value="United Kingdom">United Kingdom</option>
                            <option value="United States">United States</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group col-md-6">
                        <label for="state">State / Province</label>
                        <input class="form-control" id="state" name="state" autocomplete="address-level1" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="phoneNumber">Phone number</label>
                    <div class="input-group">
                        <select class="form-control cf-country-code" id="countryCode" name="countryCode" aria-label="Country calling code" required>
                            <option value="+234">+234 NG</option>
                            <option value="+233">+233 GH</option>
                            <option value="+254">+254 KE</option>
                            <option value="+27">+27 ZA</option>
                            <option value="+44">+44 UK</option>
                            <option value="+1">+1 US/CA</option>
                        </select>
                        <input class="form-control" id="phoneNumber" name="phoneNumber" type="tel" placeholder="801 234 5678" autocomplete="tel-national" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="track">Track</label>
                    <select class="form-control" id="track" name="track" required>
                        <option value="Data">Data</option>
                        <option value="Product">Product</option>
                        <option value="Software">Software</option>
                        <option value="Design">Design</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="hearAboutUs">How did you hear about us?</label>
                    <select class="form-control" id="hearAboutUs" name="hearAboutUs" required>
                        <option value="" selected disabled>Select an option</option>
                        <option>Social media</option>
                        <option>Friend or colleague</option>
                        <option>Search engine</option>
                        <option>Event or community</option>
                        <option>Other</option>
                    </select>
                </div>
                <fieldset id="cf-internship-fields" hidden>
                    <legend>Internship requirements</legend>
                    <div class="form-group">
                        <label for="cv">CV / Resume (PDF or Word document, up to 5MB)</label>
                        <input class="form-control" id="cv" name="cv" type="file" accept=".pdf,.doc,.docx">
                    </div>
                    <div class="form-group">
                        <label for="portfolioUrl">GitHub / Portfolio URL</label>
                        <input class="form-control" id="portfolioUrl" name="portfolioUrl" type="url" placeholder="https://">
                    </div>
                    <div class="form-group">
                        <label for="linkedinUrl">LinkedIn URL</label>
                        <input class="form-control" id="linkedinUrl" name="linkedinUrl" type="url" placeholder="https://">
                    </div>
                </fieldset>
                <div class="form-group form-check">
                    <input class="form-check-input" id="terms" type="checkbox" required>
                    <label class="form-check-label" for="terms">I agree to the terms and privacy policy.</label>
                </div>
                <p id="cf-apply-error" class="alert alert-danger" role="alert" hidden></p>
                <button id="cf-apply-submit" class="main-btn cf-apply-submit" type="submit">Continue to payment</button>
            </form>

            <section id="cf-apply-payment" aria-live="polite" hidden>
                <h2>Application received</h2>
                <p id="cf-apply-payment-summary"></p>
                <button id="cf-apply-pay" class="main-btn cf-apply-submit" type="button">Proceed to payment</button>
                <p id="cf-apply-payment-error" class="alert alert-danger" role="alert" hidden></p>
            </section>
        </section>
    </main>

    <button id="cf-chat-btn" aria-label="Open CareerForge assistant">&#128172;</button>
    <div id="cf-chat">
        <header>CareerForge Assistant</header>
        <div id="cf-log" aria-live="polite"></div>
        <form><input placeholder="Ask about programmes..." aria-label="Message"><button type="submit">Send</button></form>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
